<svg xmlns="http://www.w3.org/2000/svg" width="680" height="456" viewBox="0 0 680 456" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Exact calculator architecture</title>
<desc>A PyQt process holding the interaction shim talks over stdin and stdout to a Lean process, where a trusted effect shim wraps a pure calculator; planned pure packages feed the calculator.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.box { fill: #FAFAF7; stroke: #B4B2A9; }
.coral rect { fill: #FAECE7; stroke: #993C1D; } .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
</style>
</defs>
<rect width="680" height="456" fill="#FFFFFF"/>
<rect class="box" x="40" y="40" width="200" height="250" rx="16"/>
<text class="th" x="140" y="66" text-anchor="middle" dominant-baseline="central">PyQt process</text>
<text class="ts" x="140" y="84" text-anchor="middle" dominant-baseline="central">Interaction shim</text>
<g class="coral">
<rect x="60" y="100" width="160" height="70" rx="8"/>
<text class="th" x="140" y="126" text-anchor="middle" dominant-baseline="central">shim.py</text>
<text class="ts" x="140" y="146" text-anchor="middle" dominant-baseline="central">Buttons, 60 Hz tick</text>
</g>
<g class="gray">
<rect x="60" y="204" width="160" height="62" rx="8"/>
<text class="th" x="140" y="226" text-anchor="middle" dominant-baseline="central">layout.json</text>
<text class="ts" x="140" y="246" text-anchor="middle" dominant-baseline="central">Size, pages, buttons</text>
</g>
<line x1="140" y1="204" x2="140" y2="174" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="420" y="40" width="220" height="250" rx="16"/>
<text class="th" x="530" y="66" text-anchor="middle" dominant-baseline="central">Lean process</text>
<text class="ts" x="530" y="84" text-anchor="middle" dominant-baseline="central">Backend</text>
<g class="coral">
<rect x="440" y="100" width="180" height="70" rx="8"/>
<text class="th" x="530" y="126" text-anchor="middle" dominant-baseline="central">Effect.lean</text>
<text class="ts" x="530" y="146" text-anchor="middle" dominant-baseline="central">Only stdin and stdout</text>
</g>
<g class="teal">
<rect x="440" y="204" width="180" height="66" rx="8"/>
<text class="th" x="530" y="228" text-anchor="middle" dominant-baseline="central">Calc.lean</text>
<text class="ts" x="530" y="248" text-anchor="middle" dominant-baseline="central">Pure step, draws pixels</text>
</g>
<line x1="500" y1="170" x2="500" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="204" x2="560" y2="174" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="330" y="108" text-anchor="middle" dominant-baseline="central">Button id, one line</text>
<line x1="222" y1="122" x2="436" y2="122" class="arr" marker-end="url(#arrow)"/>
<line x1="438" y1="150" x2="224" y2="150" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="330" y="166" text-anchor="middle" dominant-baseline="central">Page, size, RGB pixels</text>
<rect x="200" y="330" width="440" height="106" rx="12" fill="none" stroke="#888780" stroke-dasharray="4 3"/>
<text class="th" x="216" y="350" dominant-baseline="central">Planned pure packages</text>
<line x1="530" y1="330" x2="530" y2="274" class="arr" marker-end="url(#arrow)"/>
<g class="teal">
<rect x="212" y="368" width="128" height="54" rx="8" stroke-dasharray="4 3"/>
<text class="th" x="276" y="386" text-anchor="middle" dominant-baseline="central">Float maths</text>
<text class="ts" x="276" y="405" text-anchor="middle" dominant-baseline="central">Verified floats</text>
</g>
<g class="teal">
<rect x="352" y="368" width="128" height="54" rx="8" stroke-dasharray="4 3"/>
<text class="th" x="416" y="386" text-anchor="middle" dominant-baseline="central">Plotting</text>
<text class="ts" x="416" y="405" text-anchor="middle" dominant-baseline="central">Emits SVG</text>
</g>
<g class="teal">
<rect x="492" y="368" width="128" height="54" rx="8" stroke-dasharray="4 3"/>
<text class="th" x="556" y="386" text-anchor="middle" dominant-baseline="central">LeanSvg</text>
<text class="ts" x="556" y="405" text-anchor="middle" dominant-baseline="central">RGB buffer out</text>
</g>
<g class="coral"><rect x="40" y="340" width="12" height="12" rx="2"/></g>
<text class="ts" x="60" y="346" dominant-baseline="central">Does I/O</text>
<g class="teal"><rect x="40" y="364" width="12" height="12" rx="2"/></g>
<text class="ts" x="60" y="370" dominant-baseline="central">Pure, no I/O</text>
<rect x="40" y="388" width="12" height="12" rx="2" fill="none" stroke="#888780" stroke-dasharray="3 2"/>
<text class="ts" x="60" y="394" dominant-baseline="central">Planned</text>
</svg>
